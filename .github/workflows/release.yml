# Publishes a release when a version tag (v1.2.3) is pushed. Actions are
# pinned to commit SHAs (tag in the comment); update both together.
#
# Needs the repository secret HOMEBREW_TAP_GITHUB_TOKEN: a fine-grained token
# with "Contents: read and write" on hotcfg/homebrew-tap only.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release

jobs:
  goreleaser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the changelog needs the tags
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
